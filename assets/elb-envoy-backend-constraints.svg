<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="894" viewBox="0 0 1120 894" role="img" aria-labelledby="title desc">
  <title id="title">백엔드 프록시 유무에 따른 제약 비교</title>
  <desc id="desc">EKS Pod, ECS 태스크, EC2에 백엔드 프록시가 없을 때와 더했을 때의 제약 비교. 프록시 유무와 관계없이 경로, 헤더, 가중치, 직접 응답, 요청 제한, 백엔드 TLS는 ELB for Envoy가 처리하며, 백엔드 앱이 클라이언트 인증서를 요구하면 사이드카 없이도 Gateway와 백엔드 사이 mTLS가 된다. EKS Pod는 사이드카 없이 Pod IP로 받을 수 있지만 Pod별 인바운드 제한, 메시 mTLS와 인가, STRICT 메시 서비스 호출을 쓸 수 없고 바뀌는 Pod IP는 DNS나 EDS로 따라가야 한다. Istio 사이드카를 더하면 Pod별 100 TPS 제한, 메시 mTLS와 인가, 호출 구간 라우팅을 쓰지만 istiod를 운영하고 STRICT에서는 인입 프록시도 메시 인증서가 필요하다. ECS 태스크는 Service Connect를 더하면 Cloud Map 이름 발견, 타임아웃, AWS Private CA 기반 TLS, CloudWatch 지표를 얻지만 프록시를 직접 설정할 수 없고 Istio 메시와는 별개다. EC2에 직접 띄운 프로세스에는 관리형 선택지가 없어 앱이 처리하거나 ECS 서비스로 옮긴다.</desc>
