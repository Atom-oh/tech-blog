<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
  <title id="title">ELB for Envoy가 Istio 인입 게이트웨이에서 맡을 수 있는 범위</title>
  <desc id="desc">2026년 11월 26일 도쿄에서 CloudFront, 내부 NLB, ELB for Envoy 1.40을 거쳐 EKS Pod, EC2, ECS 태스크로 요청을 보냈다. 관리형 Envoy에 직접 넣은 설정으로 경로 재작성은 세 백엔드 모두 /probe를 받았고, 80 대 20 가중치는 50건 중 EC2 43건, ECS 7건이었다. 버킷 2의 로컬 제한은 16건 중 4건 통과, 12건 429였고, 외부 RLS 글로벌 제한은 프록시 두 대 합계 24건 중 2건 통과, 22건 429였다. xDS ZIP만 교체하자 /revision 응답이 12:31:56 UTC의 v1에서 12:32:29 UTC의 v2로 바뀌었다. subset 레이블에 따른 엔드포인트 갱신, 워크로드 인증서와 mTLS, 사이드카 정책 배포, Pod별 100 TPS 제한은 컨트롤 플레인과 사이드카가 계속 맡는다. 설정을 바꾸는 주체는 배포 파이프라인, 자체 xDS 서버, EKS의 Envoy Gateway 통합 중 하나이며 이번 실습은 배포 파이프라인 방식이다.</desc>
