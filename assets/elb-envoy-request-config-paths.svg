<svg class="rcp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="rcp-title rcp-desc" style="display:block;width:100%;height:auto;margin:24px auto;background:#fff;border:1px solid var(--border);border-radius:7px;padding:16px;box-sizing:border-box;filter:var(--art-dim)"><title id="rcp-title">요청 경로와 설정 경로 · 옵션은 필요할 때만</title><desc id="rcp-desc">요청 경로와 설정 경로. 기본 구성에서는 요청이 클라이언트에서 CloudFront와 내부 NLB를 지나 ELB for Envoy로 가고, ELB for Envoy가 EC2 앱, ECS 태스크의 앱 컨테이너, EKS Pod의 앱 컨테이너로 바로 보낸다. 설정은 CloudFormation이 bootstrap과 xDS ZIP으로 ELB for Envoy에 전달한다. 회색으로 표시한 두 옵션은 필요할 때만 켠다. Istio 사이드카를 켜면 EKS Pod에 istio-proxy가 추가되어 요청이 istio-proxy를 거쳐 앱으로 가고, 플랫폼 팀이 설치한 istiod가 Kubernetes API의 Istio 리소스를 읽어 istio-proxy에 xDS로 설정을 보낸다. 얻는 것은 Pod별 인바운드 제한과 메시 mTLS, 대가는 istiod 운영과 둘로 나뉘는 설정 소유자다. 외부 RLS를 켜면 ELB for Envoy가 요청마다 RLS에 판정을 물어 서비스 전체가 한 한도를 공유한다.</desc><defs><marker id="rcp-req" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#4f8a68" stroke-width="1.6"/></marker><marker id="rcp-cfg" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7b5ea7" stroke-width="1.6"/></marker><marker id="rcp-off" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#c3c7cc" stroke-width="1.6"/></marker><marker id="rcp-gray" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#5f6670" stroke-width="1.6"/></marker></defs><style>.rcp .on{opacity:0;transition:opacity .25s} .rcp .off{transition:opacity .25s} .rcp .opt{cursor:pointer;outline:none} .rcp:has(.t-sc:hover,.t-sc:focus,.o-sc:hover,.o-sc:focus) .o-sc .on, .rcp:has(.t-rls:hover,.t-rls:focus,.o-rls:hover,.o-rls:focus) .o-rls .on{opacity:1} .rcp:has(.t-sc:hover,.t-sc:focus,.o-sc:hover,.o-sc:focus) .o-sc .off, .rcp:has(.t-rls:hover,.t-rls:focus,.o-rls:hover,.o-rls:focus) .o-rls .off{opacity:0} .rcp:has(.t-sc:hover,.t-sc:focus,.o-sc:hover,.o-sc:focus) .direct-eks{opacity:.15} .rcp:has(.t-sc:hover,.t-sc:focus,.o-sc:hover,.o-sc:focus) .t-sc .on, .rcp:has(.t-rls:hover,.t-rls:focus,.o-rls:hover,.o-rls:focus) .t-rls .on{opacity:1} .rcp:has(.opt:hover,.opt:focus) .hint{opacity:0} .rcp .direct-eks,.rcp .hint{transition:opacity .25s}</style><rect width="1120" height="650" rx="20" fill="#fbfaf7"/><g font-family="Noto Sans CJK KR, Pretendard, sans-serif"><text x="42" y="49" fill="#5f6670" font-size="18" font-weight="600" letter-spacing="2">REQUEST PATH · CONFIG PATH · OPTIONS ARE GRAY</text><text x="42" y="93" fill="#222e3b" font-size="27" font-weight="700">기본은 Envoy 하나 · 회색 칸은 고를 때만 켜집니다</text><path d="M790 128 L826 128" stroke="#4f8a68" stroke-width="3"/><text x="834" y="133" fill="#5f6670" font-size="13">HTTP 요청</text><path d="M920 128 L956 128" stroke="#7b5ea7" stroke-width="2.4" stroke-dasharray="6 4"/><text x="964" y="133" fill="#5f6670" font-size="13">설정 전달</text><text x="44" y="133" fill="#222e3b" font-size="14" font-weight="700">옵션 켜 보기</text><g class="opt t-sc" tabindex="0" role="button" aria-label="① Istio 사이드카 · EKS만 켜 보기"><g class="off"><rect x="150" y="112" width="214" height="32" rx="16" fill="#ffffff" stroke="#c3c7cc" stroke-width="1.5"/><text x="257.0" y="133" fill="#9aa0a6" font-size="13" font-weight="700" text-anchor="middle">① Istio 사이드카 · EKS만</text></g><g class="on"><rect x="150" y="112" width="214" height="32" rx="16" fill="#f6f0e1" stroke="#b58938" stroke-width="1.8"/><text x="257.0" y="133" fill="#6b4f17" font-size="13" font-weight="700" text-anchor="middle">① Istio 사이드카 · EKS만</text></g></g><g class="opt t-rls" tabindex="0" role="button" aria-label="② 외부 RLS 켜 보기"><g class="off"><rect x="376" y="112" width="150" height="32" rx="16" fill="#ffffff" stroke="#c3c7cc" stroke-width="1.5"/><text x="451.0" y="133" fill="#9aa0a6" font-size="13" font-weight="700" text-anchor="middle">② 외부 RLS</text></g><g class="on"><rect x="376" y="112" width="150" height="32" rx="16" fill="#f6f0e1" stroke="#b58938" stroke-width="1.8"/><text x="451.0" y="133" fill="#6b4f17" font-size="13" font-weight="700" text-anchor="middle">② 외부 RLS</text></g></g><rect x="44" y="336" width="96" height="48" rx="10" fill="#ffffff" stroke="#d6d6cf" stroke-width="1.5"/><text x="92.0" y="365.0" fill="#222e3b" font-size="14" font-weight="700" text-anchor="middle">클라이언트</text><path d="M142 360 L166 360" stroke="#4f8a68" stroke-width="2.2" fill="none" marker-end="url(#rcp-req)"/><rect x="170" y="336" width="132" height="48" rx="10" fill="#ffffff" stroke="#d6d6cf" stroke-width="1.5"/><text x="236.0" y="357.0" fill="#222e3b" font-size="14" font-weight="700" text-anchor="middle">CloudFront</text><text x="236.0" y="375.0" fill="#5f6670" font-size="11" text-anchor="middle">→ 내부 NLB</text><path d="M304 360 L330 360" stroke="#4f8a68" stroke-width="2.2" fill="none" marker-end="url(#rcp-req)"/><rect x="334" y="316" width="190" height="88" rx="10" fill="#e3ecf8" stroke="#4a6fa5" stroke-width="1.5"/><text x="429.0" y="357.0" fill="#1f3b63" font-size="14" font-weight="700" text-anchor="middle">ELB for Envoy</text><text x="429.0" y="375.0" fill="#5f6670" font-size="11" text-anchor="middle">라우트·헤더·가중치·제한</text><rect x="334" y="486" width="190" height="54" rx="10" fill="#f3eef9" stroke="#7b5ea7" stroke-width="1.5"/><text x="429.0" y="510.0" fill="#222e3b" font-size="14" font-weight="700" text-anchor="middle">CloudFormation</text><text x="429.0" y="528.0" fill="#5f6670" font-size="11" text-anchor="middle">bootstrap + xDS ZIP</text><path d="M429 484 L429 408" stroke="#7b5ea7" stroke-width="2" fill="none" marker-end="url(#rcp-cfg)" stroke-dasharray="6 4"/><rect x="620" y="176" width="230" height="52" rx="10" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/><text x="735.0" y="199.0" fill="#222e3b" font-size="14" font-weight="700" text-anchor="middle">EC2 인스턴스</text><text x="735.0" y="217.0" fill="#5f6670" font-size="11" text-anchor="middle">앱 프로세스</text><rect x="620" y="246" width="230" height="52" rx="10" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/><text x="735.0" y="269.0" fill="#222e3b" font-size="14" font-weight="700" text-anchor="middle">ECS 태스크</text><text x="735.0" y="287.0" fill="#5f6670" font-size="11" text-anchor="middle">앱 컨테이너 하나</text><path d="M526 330 C580 330 580 202 616 202" stroke="#4f8a68" stroke-width="2.2" fill="none" marker-end="url(#rcp-req)"/><path d="M526 340 C590 340 590 272 616 272" stroke="#4f8a68" stroke-width="2.2" fill="none" marker-end="url(#rcp-req)"/><rect x="620" y="318" width="300" height="132" rx="14" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.6"/><text x="636" y="340" fill="#222e3b" font-size="15" font-weight="700">EKS Pod</text><text x="904" y="340" fill="#5f6670" font-size="11" text-anchor="end">VPC CNI가 준 Pod IP</text><rect x="780" y="362" width="126" height="56" rx="10" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/><text x="843.0" y="387.0" fill="#222e3b" font-size="14" font-weight="700" text-anchor="middle">앱 컨테이너</text><text x="843.0" y="405.0" fill="#5f6670" font-size="11" text-anchor="middle">주문 API</text><g class="direct-eks"><path d="M526 360 C600 360 640 352 760 352 L838 352 L838 358" stroke="#4f8a68" stroke-width="2.2" fill="none" marker-end="url(#rcp-req)"/></g><g class="opt o-sc" tabindex="0" role="button" aria-label="Istio 사이드카 옵션 켜 보기"><g class="off"><rect x="636" y="362" width="128" height="56" rx="10" fill="#f1f2f3" stroke="#c3c7cc" stroke-width="1.5" stroke-dasharray="5 4"/><text x="700.0" y="387.0" fill="#9aa0a6" font-size="14" font-weight="700" text-anchor="middle">istio-proxy</text><text x="700.0" y="405.0" fill="#9aa0a6" font-size="11" text-anchor="middle">사이드카</text><path d="M526 372 C580 372 590 390 632 390" stroke="#c3c7cc" stroke-width="2.2" fill="none" marker-end="url(#rcp-off)" stroke-dasharray="5 4"/><path d="M766 390 L776 390" stroke="#c3c7cc" stroke-width="2.2" fill="none" marker-end="url(#rcp-off)" stroke-dasharray="5 4"/><rect x="950" y="330" width="146" height="56" rx="10" fill="#f1f2f3" stroke="#c3c7cc" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1023.0" y="355.0" fill="#9aa0a6" font-size="14" font-weight="700" text-anchor="middle">Istio 리소스</text><text x="1023.0" y="373.0" fill="#9aa0a6" font-size="11" text-anchor="middle">VirtualService 등</text><rect x="950" y="430" width="146" height="56" rx="10" fill="#f1f2f3" stroke="#c3c7cc" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1023.0" y="455.0" fill="#9aa0a6" font-size="14" font-weight="700" text-anchor="middle">istiod</text><text x="1023.0" y="473.0" fill="#9aa0a6" font-size="11" text-anchor="middle">istio-system · 플랫폼 팀</text><path d="M1023 388 L1023 426" stroke="#c3c7cc" stroke-width="2" fill="none" marker-end="url(#rcp-off)" stroke-dasharray="6 4"/><path d="M948 458 C880 458 760 470 700 422" stroke="#c3c7cc" stroke-width="2" fill="none" marker-end="url(#rcp-off)" stroke-dasharray="6 4"/><text x="860" y="486" fill="#9aa0a6" font-size="12" font-weight="700" text-anchor="middle">xDS</text><text x="700" y="438" fill="#9aa0a6" font-size="11" font-weight="700" text-anchor="middle">옵션</text><text x="1023" y="512" fill="#9aa0a6" font-size="11" font-weight="700" text-anchor="middle">옵션</text></g><g class="on"><rect x="636" y="362" width="128" height="56" rx="10" fill="#eaf3ec" stroke="#4f8a68" stroke-width="1.5"/><text x="700.0" y="387.0" fill="#2f5e43" font-size="14" font-weight="700" text-anchor="middle">istio-proxy</text><text x="700.0" y="405.0" fill="#5f6670" font-size="11" text-anchor="middle">사이드카</text><path d="M526 372 C580 372 590 390 632 390" stroke="#4f8a68" stroke-width="2.2" fill="none" marker-end="url(#rcp-req)"/><path d="M766 390 L776 390" stroke="#4f8a68" stroke-width="2.2" fill="none" marker-end="url(#rcp-req)"/><rect x="950" y="330" width="146" height="56" rx="10" fill="#ffffff" stroke="#d6d6cf" stroke-width="1.5"/><text x="1023.0" y="355.0" fill="#222e3b" font-size="14" font-weight="700" text-anchor="middle">Istio 리소스</text><text x="1023.0" y="373.0" fill="#5f6670" font-size="11" text-anchor="middle">VirtualService 등</text><rect x="950" y="430" width="146" height="56" rx="10" fill="#f3eef9" stroke="#7b5ea7" stroke-width="1.5"/><text x="1023.0" y="455.0" fill="#7b5ea7" font-size="14" font-weight="700" text-anchor="middle">istiod</text><text x="1023.0" y="473.0" fill="#5f6670" font-size="11" text-anchor="middle">istio-system · 플랫폼 팀</text><path d="M1023 388 L1023 426" stroke="#7b5ea7" stroke-width="2" fill="none" marker-end="url(#rcp-cfg)" stroke-dasharray="6 4"/><path d="M948 458 C880 458 760 470 700 422" stroke="#7b5ea7" stroke-width="2" fill="none" marker-end="url(#rcp-cfg)" stroke-dasharray="6 4"/><text x="860" y="486" fill="#7b5ea7" font-size="12" font-weight="700" text-anchor="middle">xDS</text></g></g><g class="opt o-rls" tabindex="0" role="button" aria-label="외부 RLS 옵션 켜 보기"><g class="off"><rect x="334" y="176" width="190" height="56" rx="10" fill="#f1f2f3" stroke="#c3c7cc" stroke-width="1.5" stroke-dasharray="5 4"/><text x="429.0" y="201.0" fill="#9aa0a6" font-size="14" font-weight="700" text-anchor="middle">외부 RLS</text><text x="429.0" y="219.0" fill="#9aa0a6" font-size="11" text-anchor="middle">서비스 전체 공유 한도</text><path d="M429 314 L429 236" stroke="#c3c7cc" stroke-width="1.8" fill="none" marker-end="url(#rcp-off)" stroke-dasharray="4 4"/><text x="440" y="278" fill="#9aa0a6" font-size="11">ShouldRateLimit</text><text x="512" y="196" fill="#9aa0a6" font-size="11" font-weight="700" text-anchor="end">옵션</text></g><g class="on"><rect x="334" y="176" width="190" height="56" rx="10" fill="#ffffff" stroke="#b58938" stroke-width="1.5"/><text x="429.0" y="201.0" fill="#222e3b" font-size="14" font-weight="700" text-anchor="middle">외부 RLS</text><text x="429.0" y="219.0" fill="#5f6670" font-size="11" text-anchor="middle">서비스 전체 공유 한도</text><path d="M429 314 L429 236" stroke="#5f6670" stroke-width="1.8" fill="none" marker-end="url(#rcp-gray)" stroke-dasharray="4 4"/><text x="440" y="278" fill="#5f6670" font-size="11">ShouldRateLimit</text></g></g><text x="44" y="470" fill="#1f3b63" font-size="14" font-weight="700">기본 구성</text><text x="44" y="492" fill="#222e3b" font-size="12">요청: ELB for Envoy → 앱</text><text x="44" y="512" fill="#222e3b" font-size="12">설정: CloudFormation 하나</text><text x="44" y="532" fill="#5f6670" font-size="12">Istio 설치 · 백엔드 변경 없음</text><rect x="24" y="562" width="1072" height="72" rx="12" fill="#ffffff" stroke="#d6d6cf" stroke-width="1.2"/><g class="hint"><text x="560" y="604" fill="#5f6670" font-size="13" text-anchor="middle">회색 칸이나 위의 옵션에 마우스를 올리거나 탭하면 켜지고, 얻는 것과 대가가 여기에 나타납니다</text></g><g class="o-sc"><g class="on"><text x="44" y="590" fill="#2f5e43" font-size="14" font-weight="700">① 사이드카를 켜면: Pod별 인바운드 제한 · 메시 mTLS·AuthorizationPolicy · 호출 구간 라우팅</text><text x="44" y="614" fill="#6b4f17" font-size="13">대가: istiod 설치·업그레이드 · 주입은 새 Pod부터 · 설정 소유자가 둘(CloudFormation + Istio 리소스)</text></g></g><g class="o-rls"><g class="on"><text x="44" y="590" fill="#2f5e43" font-size="14" font-weight="700">② 외부 RLS를 켜면: 여러 프록시와 목적지가 한 한도를 공유</text><text x="44" y="614" fill="#6b4f17" font-size="13">대가: 요청마다 gRPC 판정 · RLS 가용성과 장애 시 통과/거부 정책 · 여러 대면 Redis 같은 공유 카운터</text></g></g></g></svg>
