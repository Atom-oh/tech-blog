# ELB for Envoy bootstrap: ADS over mTLS to a self-run xDS server. Only accepted bootstrap fields are used.
# /xds-auth/* comes from the configuration archive; replace 10.0.12.34 with the xDS server's private IP.
node:
  cluster: order-gw
dynamic_resources:
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    grpc_services: [{envoy_grpc: {cluster_name: xds_cluster}}]
    set_node_on_first_message_only: true
  lds_config: {ads: {}, resource_api_version: V3}
  cds_config: {ads: {}, resource_api_version: V3}
static_resources:
  clusters:
  - name: xds_cluster
    type: STATIC
    connect_timeout: 2s
    load_assignment:
      cluster_name: xds_cluster
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 10.0.12.34, port_value: 18000}}}}]}]
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: xds.example.test
        common_tls_context:
          tls_certificate_sds_secret_configs:
          - name: xds_client
            sds_config:
              path_config_source: {path: /xds-auth/xds-client.yaml, watched_directory: {path: /xds-auth}}
              resource_api_version: V3
          validation_context_sds_secret_config:
            name: xds_server_ca
            sds_config:
              path_config_source: {path: /xds-auth/xds-server-ca.yaml, watched_directory: {path: /xds-auth}}
              resource_api_version: V3
