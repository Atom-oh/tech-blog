# An Envoy Gateway-managed GatewayClass named elb-proxy-aws, the remote provider
# and the order namespace must already exist. Replace the example IAM role ARN.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: orders-ingress, namespace: order}
spec:
  gatewayClassName: elb-proxy-aws
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: orders.example.com
      allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.elbproxy.aws/v1alpha1
kind: ELBProxyConfiguration
metadata: {name: orders-private-proxy, namespace: order}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: orders-ingress}
  roleArn: arn:aws:iam::123456789012:role/elb-envoy-proxy
  networkConfiguration:
    ipConfiguration:
      ipAddressingConfiguration: {ipv4Addressability: internal, ipv6Addressability: "off"}
---
apiVersion: v1
kind: Service
metadata: {name: api-stable, namespace: order}
spec:
  selector: {app: api, version: v1}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: api-canary, namespace: order}
spec:
  selector: {app: api, version: v2}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: orders, namespace: order}
spec:
  parentRefs: [{name: orders-ingress, sectionName: http}]
  hostnames: [orders.example.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /orders}}]
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add: [{name: x-order-hop, value: ingress}]
            set: [{name: x-order-source, value: public-api}]
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      timeouts: {request: 3s}
      backendRefs:
        - {name: api-stable, port: 8080, weight: 90}
        - {name: api-canary, port: 8080, weight: 10}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata: {name: maintenance-response, namespace: order}
spec:
  directResponse:
    statusCode: 503
    contentType: text/plain
    body: {type: Inline, inline: "orders under maintenance"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: orders-maintenance, namespace: order}
spec:
  parentRefs: [{name: orders-ingress, sectionName: http}]
  hostnames: [orders.example.com]
  rules:
    - matches: [{path: {type: Exact, value: /orders/maintenance}}]
      filters:
        - type: ExtensionRef
          extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: maintenance-response}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: {name: orders-local-limit, namespace: order}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders}]
  rateLimit:
    local:
      rules:
        - limit: {requests: 100, unit: Second}
