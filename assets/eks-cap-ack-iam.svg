<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">관리형 ACK의 네임스페이스별 IAM 역할 선택 구조</title>
  <desc id="desc">team-a와 team-b 네임스페이스의 CR을 AWS 소유 인프라의 ACK capability가 감시한다. capability role에는 sts:AssumeRole과 sts:TagSession만 있고, 클러스터 범위 IAMRoleSelector가 네임스페이스에 맞는 팀 역할을 고른다. team-a 역할은 S3, SQS, DynamoDB, team-b 역할은 SQS만 허용한다. team-b의 Queue는 8.3초 만에 동기화됐고, team-b의 Bucket은 s3:ListAllMyBuckets 거부로 Ready=False가 됐으며 거부 메시지에 team-b 역할 이름이 나왔다. 선택자가 없는 네임스페이스는 capability role을 쓰므로 서비스 권한이 없어 거부된다(문서 기준). 모든 AWS 호출에는 capability ARN, 네임스페이스, API 그룹 세션 태그가 붙는다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#405267" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1120" height="760" rx="20" fill="#fbfaf7"/>
  <g font-family="Noto Sans CJK KR, sans-serif">
    <text x="42" y="49" fill="#5f6670" font-size="18" font-weight="600" letter-spacing="2">EKS CAPABILITY · ACK</text>
    <text x="42" y="93" fill="#222e3b" font-size="31" font-weight="700">네임스페이스마다 다른 IAM 역할로 AWS를 호출합니다</text>

    <!-- cluster -->
    <rect x="40" y="130" width="340" height="490" rx="16" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
    <text x="60" y="162" fill="#26394b" font-size="19" font-weight="700">EKS 클러스터</text>
    <rect x="60" y="180" width="300" height="90" rx="12" fill="#e7f4ef" stroke="#3c7c68"/>
    <text x="78" y="212" fill="#245c4b" font-size="17" font-weight="700">team-a 네임스페이스</text>
    <text x="78" y="242" fill="#245c4b" font-size="14">Bucket · Queue · Table CR</text>
    <rect x="60" y="290" width="300" height="90" rx="12" fill="#fff4df" stroke="#b88632"/>
    <text x="78" y="322" fill="#654814" font-size="17" font-weight="700">team-b 네임스페이스</text>
    <text x="78" y="352" fill="#654814" font-size="14">Queue · Bucket CR</text>
    <rect x="60" y="400" width="300" height="66" rx="12" fill="#f3f1ec" stroke="#c9c3b6" stroke-dasharray="6 5"/>
    <text x="78" y="429" fill="#5f6670" font-size="15" font-weight="700">선택자가 없는 네임스페이스</text>
    <text x="78" y="452" fill="#5f6670" font-size="14">capability role을 그대로 씀 (문서 기준)</text>
    <rect x="60" y="486" width="300" height="114" rx="12" fill="#fbfaf7" stroke="#9aa5b1"/>
    <text x="78" y="516" fill="#26394b" font-size="16" font-weight="700">IAMRoleSelector (클러스터 범위)</text>
    <text x="78" y="543" fill="#26394b" font-size="14">namespaceSelector: team-a → team-a 역할</text>
    <text x="78" y="566" fill="#26394b" font-size="14">namespaceSelector: team-b → team-b 역할</text>
    <text x="78" y="588" fill="#5f6670" font-size="14">CR 조건 ACK.IAMRoleSelected=True</text>

    <!-- AWS owned -->
    <rect x="410" y="130" width="290" height="490" rx="16" fill="#f1f5fb" stroke="#6f8fb8" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="430" y="162" fill="#1f3b63" font-size="19" font-weight="700">AWS 소유 인프라</text>
    <rect x="430" y="180" width="250" height="130" rx="12" fill="#e3ecf8" stroke="#4a6fa5" stroke-width="2"/>
    <text x="555" y="217" text-anchor="middle" fill="#1f3b63" font-size="23" font-weight="700">ACK capability</text>
    <text x="555" y="248" text-anchor="middle" fill="#33557f" font-size="14">upstream GA 서비스 컨트롤러 전부</text>
    <text x="555" y="272" text-anchor="middle" fill="#33557f" font-size="14">46.186.1-eks-1 · 워커 노드 Pod 0개</text>
    <rect x="430" y="380" width="250" height="140" rx="12" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.6"/>
    <text x="555" y="414" text-anchor="middle" fill="#1f3b63" font-size="20" font-weight="700">capability role</text>
    <text x="555" y="442" text-anchor="middle" fill="#33557f" font-size="14">sts:AssumeRole</text>
    <text x="555" y="464" text-anchor="middle" fill="#33557f" font-size="14">sts:TagSession</text>
    <text x="555" y="494" text-anchor="middle" fill="#8a2c20" font-size="14">서비스 권한은 주지 않음</text>
    <path d="M555 310V372" fill="none" stroke="#405267" stroke-width="1.6" stroke-dasharray="6 5"/>

    <!-- roles -->
    <rect x="730" y="180" width="350" height="90" rx="12" fill="#e7f4ef" stroke="#3c7c68"/>
    <text x="748" y="212" fill="#245c4b" font-size="16" font-weight="700">IAM 역할 eks-cap-demo-ack-team-a</text>
    <text x="748" y="242" fill="#245c4b" font-size="14">허용: S3 (ListAllMyBuckets 포함) · SQS · DynamoDB</text>
    <rect x="730" y="290" width="350" height="90" rx="12" fill="#fff4df" stroke="#b88632"/>
    <text x="748" y="322" fill="#654814" font-size="16" font-weight="700">IAM 역할 eks-cap-demo-ack-team-b</text>
    <text x="748" y="352" fill="#654814" font-size="14">허용: SQS만</text>

    <rect x="730" y="410" width="350" height="56" rx="12" fill="#e7f4ef" stroke="#3c7c68"/>
    <text x="748" y="444" fill="#245c4b" font-size="14">team-b Queue: 8.3초 만에 동기화 (생성 직후 첫 측정)</text>
    <rect x="730" y="480" width="350" height="120" rx="12" fill="#fbe9e7" stroke="#b5483a"/>
    <text x="748" y="508" fill="#8a2c20" font-size="15" font-weight="700">team-b Bucket: 거부</text>
    <text x="748" y="533" fill="#8a2c20" font-size="14">assumed-role/eks-cap-demo-ack-team-b/…</text>
    <text x="748" y="555" fill="#8a2c20" font-size="14">is not authorized to perform s3:ListAllMyBuckets</text>
    <text x="748" y="580" fill="#8a2c20" font-size="14">Ready=False · 어느 역할이 막혔는지 CR에 보임</text>

    <!-- flows -->
    <path d="M430 225H368" fill="none" stroke="#405267" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M430 262H392V335H368" fill="none" stroke="#405267" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="391" y="210" text-anchor="middle" fill="#5f6670" font-size="14">watch</text>
    <path d="M366 543H395V470H422" fill="none" stroke="#405267" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <path d="M680 410H708V225H722" fill="none" stroke="#405267" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M680 440H714V335H722" fill="none" stroke="#405267" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="555" y="552" text-anchor="middle" fill="#5f6670" font-size="14">네임스페이스에 맞는 팀 역할을</text><text x="555" y="572" text-anchor="middle" fill="#5f6670" font-size="14">assume해서 AWS API 호출</text>

    <!-- session tags -->
    <rect x="410" y="640" width="670" height="62" rx="12" fill="#ffffff" stroke="#c4cbd1"/>
    <text x="430" y="667" fill="#26394b" font-size="14" font-weight="700">모든 AWS 호출의 세션 태그</text>
    <text x="430" y="690" fill="#5f6670" font-size="14">eks:eks-capability-arn · eks:kubernetes-namespace · eks:kubernetes-api-group</text>

    <!-- legend -->
    <path d="M42 735H92" stroke="#405267" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="104" y="740" fill="#5f6670" font-size="15">호출</text>
    <path d="M160 735H210" stroke="#405267" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="222" y="740" fill="#5f6670" font-size="15">설정 관계</text>
  </g>
</svg>
