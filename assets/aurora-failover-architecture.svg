<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
  <title id="title">Aurora MySQL의 스토리지 Multi-AZ와 인스턴스 Multi-AZ 배치</title>
  <desc id="desc">애플리케이션은 Writer Endpoint로 AZ A의 Writer에 접속한다. AZ B의 tier 0 Reader와 AZ C의 선택적 tier 1 Reader는 승격 후보이다. 세 인스턴스 아래의 공유 클러스터 볼륨에는 세 AZ에 걸쳐 여섯 개의 스토리지 복사본이 있다. Reader마다 독립적인 전체 볼륨을 복사하는 구조가 아니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#405267" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1120" height="750" rx="20" fill="#fbfaf7"/>
  <g font-family="Noto Sans CJK KR, sans-serif">
    <text x="42" y="49" fill="#5f6670" font-size="18" font-weight="600" letter-spacing="2">ONE REGION · AURORA MYSQL</text>
    <text x="42" y="93" fill="#222e3b" font-size="31" font-weight="700">SQL을 처리할 인스턴스도 여러 AZ에 준비합니다</text>
    <rect x="46" y="130" width="230" height="57" rx="12" fill="#edf0f3" stroke="#c4cbd1"/>
    <text x="161" y="167" text-anchor="middle" fill="#26394b" font-size="23">애플리케이션</text>
    <path d="M276 159H338" fill="none" stroke="#405267" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="350" y="130" width="328" height="57" rx="12" fill="#fff4df" stroke="#b88632"/>
    <text x="514" y="167" text-anchor="middle" fill="#654814" font-size="23">Writer Endpoint</text>
    <text x="724" y="165" fill="#5f6670" font-size="20">이름 유지 · 대상 Writer 변경</text>
    <path d="M514 187V212H205V271" fill="none" stroke="#405267" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g fill="none" stroke="#bfc8d1" stroke-width="1.5" stroke-dasharray="6 5">
      <rect x="46" y="245" width="314" height="272" rx="14"/>
      <rect x="403" y="245" width="314" height="272" rx="14"/>
      <rect x="760" y="245" width="314" height="272" rx="14"/>
    </g>
    <g fill="#526171" font-size="21" font-weight="600">
      <text x="68" y="280">AZ A</text><text x="425" y="280">AZ B</text><text x="782" y="280">AZ C</text>
    </g>
    <rect x="76" y="310" width="254" height="147" rx="14" fill="#fff3db" stroke="#aa7523" stroke-width="2"/>
    <text x="203" y="352" text-anchor="middle" font-size="28" font-weight="700" fill="#654814">Writer</text>
    <text x="203" y="390" text-anchor="middle" font-size="22" fill="#654814">demo-a</text>
    <text x="203" y="427" text-anchor="middle" font-size="19" fill="#765c2e">현재 쓰기 처리</text>
    <rect x="433" y="310" width="254" height="147" rx="14" fill="#e7f4ef" stroke="#3c7c68" stroke-width="2"/>
    <text x="560" y="352" text-anchor="middle" font-size="28" font-weight="700" fill="#245c4b">Reader</text>
    <text x="560" y="390" text-anchor="middle" font-size="22" fill="#245c4b">demo-b · tier 0</text>
    <text x="560" y="427" text-anchor="middle" font-size="19" fill="#37695a">다른 AZ의 우선 승격 후보</text>
    <rect x="790" y="310" width="254" height="147" rx="14" fill="#e7f4ef" stroke="#3c7c68" stroke-width="2"/>
    <text x="917" y="352" text-anchor="middle" font-size="28" font-weight="700" fill="#245c4b">Reader (선택)</text>
    <text x="917" y="390" text-anchor="middle" font-size="22" fill="#245c4b">demo-c · tier 1</text>
    <text x="917" y="427" text-anchor="middle" font-size="19" fill="#37695a">추가 후보 · 읽기 용량</text>
    <g stroke="#8294a2" stroke-width="2" fill="none"><path d="M203 457V552"/><path d="M560 457V552"/><path d="M917 457V552"/></g>
    <rect x="46" y="552" width="1028" height="152" rx="16" fill="#edf0f5" stroke="#bac4d1"/>
    <text x="70" y="590" font-size="24" font-weight="700" fill="#33435b">공유 클러스터 볼륨 · 3개 AZ · 스토리지 복사본 6개</text>
    <g fill="#e0e7f1" stroke="#8293b0" stroke-width="1.5">
      <rect x="76" y="612" width="98" height="45" rx="8"/><rect x="185" y="612" width="98" height="45" rx="8"/>
      <rect x="433" y="612" width="98" height="45" rx="8"/><rect x="542" y="612" width="98" height="45" rx="8"/>
      <rect x="790" y="612" width="98" height="45" rx="8"/><rect x="899" y="612" width="98" height="45" rx="8"/>
    </g>
    <g font-size="18" fill="#33435b" text-anchor="middle">
      <text x="125" y="641">AZ A · 1</text><text x="234" y="641">AZ A · 2</text>
      <text x="482" y="641">AZ B · 1</text><text x="591" y="641">AZ B · 2</text>
      <text x="839" y="641">AZ C · 1</text><text x="948" y="641">AZ C · 2</text>
    </g>
    <text x="70" y="686" fill="#526171" font-size="18">스토리지 복제와 인스턴스의 AZ 분산은 별개의 가용성 조건입니다.</text>
    <text x="46" y="733" fill="#687480" font-size="16">설명용 구성 · AWS High availability for Amazon Aurora 문서 기준</text>
  </g>
</svg>
