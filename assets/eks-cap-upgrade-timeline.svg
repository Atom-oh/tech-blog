<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">EKS 1.36에서 1.37로 in-place 업그레이드하는 동안의 capability 측정 타임라인</title>
  <desc id="desc">02:48:48에 업그레이드를 요청했고 02:55:52에 ACTIVE가 됐다. 02:52:41부터 02:55:52까지 API 서버 버전이 1.36.4와 1.37.0 사이를 오갔다. 세 capability는 내내 ACTIVE였고 버전과 health가 바뀌지 않았다. Argo CD self-heal은 2초, 6초 뒤 113초, 254초로 늘어났는데 업그레이드가 아니라 self-heal 백오프 때문이었다. kro 반영은 약 1초, ACK Queue 동기화는 1.5~3.5초였고, API 버전이 오가던 3분 동안에는 kro와 ACK 측정이 없었다.</desc>
