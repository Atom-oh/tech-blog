<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="812" viewBox="0 0 1120 812" role="img" aria-labelledby="title desc">
  <title id="title">온프레미스와 EKS Pod 사이의 요청 분배</title>
  <desc id="desc">온프레미스 Ready Pod 50개와 EKS Ready Pod 10~300개에 요청을 나누는 두 방식. A는 Envoy 클러스터 하나에 두 사이트의 Ready Pod를 모두 개별 엔드포인트로 넣는다. ROUND_ROBIN이면 EKS 비중은 EKS Ready Pod 수를 전체 Ready Pod 수로 나눈 값이 되어 EKS 10개일 때 16.7%, 50개일 때 50%, 300개일 때 85.7%이며 비율을 갱신할 컨트롤러가 필요 없다. B는 weighted_clusters로 사이트 비율을 운영자가 정한다. 예를 들어 EKS 상한을 60%로 두면 300개에서도 60%이고, 가변 정책이면 Ready EndpointSlice를 감시해 RDS를 갱신하는 컨트롤러가 필요하다. 도쿄에서는 ECS 태스크 하나를 고정 대상으로 두고 STRICT_DNS 클러스터 하나에 fixed-site와 elastic-site를 넣어, replicas만 바꿔 측정했다. EKS Pod 1개일 때 120건이 60 대 60, 3개일 때 30 대 30·30·30으로 나뉘었다.</desc>
