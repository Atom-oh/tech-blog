    <path d="M288 334 L300 334" stroke="#405267" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M438 334 L450 334" stroke="#405267" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <rect x="454" y="304" width="300" height="60" rx="10" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.4"/>
