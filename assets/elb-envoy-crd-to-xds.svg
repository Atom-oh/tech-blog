<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
  <title id="title">Istio 리소스가 Envoy xDS 설정이 되는 과정</title>
  <desc id="desc">Kubernetes API에 적용한 Istio 리소스는 프록시로 그대로 전달되지 않는다. istiod가 Gateway, VirtualService, DestinationRule, EnvoyFilter와 Service, EndpointSlice를 함께 읽어 프록시마다 Listener(LDS), RouteConfiguration(RDS), Cluster(CDS), 엔드포인트(EDS)를 계산하고 gRPC xDS로 푸시한다. ELB for Envoy에는 istiod가 들어 있지 않다. 예제에서는 같은 Envoy 리소스를 bootstrap의 고정 리스너와 HTTP 필터, /xds/routes.yaml, /xds/clusters.yaml 파일로 직접 만들었고 EDS 대신 STATIC 주소나 STRICT_DNS를 썼다. 사이드카는 istiod에서 istio-agent를 거쳐 istio-proxy로 설정을 받고, 인입 프록시는 CloudFormation이 전달한 ZIP을 파일로 읽는다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#405267" stroke-width="1.6"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#4f8a68" stroke-width="1.6"/></marker>
    <marker id="arrow-bad" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#b35a42" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1120" height="770" rx="20" fill="#fbfaf7"/>
  <g font-family="Noto Sans CJK KR, sans-serif">
    <text x="42" y="49" fill="#5f6670" font-size="18" font-weight="600" letter-spacing="2">ISTIO CRD → ENVOY xDS</text>
    <text x="42" y="93" fill="#222e3b" font-size="27" font-weight="700">istiod는 CRD를 그대로 보내지 않고 Envoy 설정으로 바꿔 보냅니다</text>
    <text x="28" y="140" fill="#5f6670" font-size="14" font-weight="700">① Kubernetes API에 적용한 선언</text>
    <text x="370.0" y="140" fill="#5f6670" font-size="14" font-weight="700" text-anchor="middle">② 변환</text>
    <text x="458" y="140" fill="#5f6670" font-size="14" font-weight="700">③ Envoy가 실제로 받는 리소스</text>
    <rect x="766" y="120" width="338" height="406" rx="14" fill="#f1f5fb" stroke="#6f8fb8" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="778" y="140" fill="#1f3b63" font-size="14" font-weight="700">ELB for Envoy에서 직접 쓰는 방법</text>
    <rect x="304" y="154" width="132" height="362" rx="14" fill="#e3ecf8" stroke="#4a6fa5" stroke-width="2"/>
    <text x="370.0" y="300" fill="#1f3b63" font-size="21" font-weight="700" text-anchor="middle">istiod</text>
    <text x="370.0" y="330" fill="#33557f" font-size="12" text-anchor="middle">선언 +</text>
    <text x="370.0" y="351" fill="#33557f" font-size="12" text-anchor="middle">서비스 레지스트리</text>
    <text x="370.0" y="372" fill="#33557f" font-size="12" text-anchor="middle">→ 프록시마다 계산</text>
    <text x="370.0" y="393" fill="#33557f" font-size="12" text-anchor="middle">→ gRPC로 푸시</text>
    <text x="370.0" y="192" fill="#33557f" font-size="11" font-weight="600" text-anchor="middle">EKS에 별도 설치</text>
    <text x="370.0" y="208" fill="#33557f" font-size="11" text-anchor="middle">(Istio 1.30.2)</text>
